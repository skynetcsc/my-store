// ========== PROXY SETUP ==========
const PROXY_BASE='http://127.0.0.1:8000/?url=';
let proxyOn=false;

function buildUrl(u){
  if(!proxyOn)return u;
  if(!u||!u.startsWith('http'))return u;
  if(u.includes('127.0.0.1:8000'))return u;
  return PROXY_BASE+encodeURIComponent(u);
}

function toggleProxy(){
  proxyOn=!proxyOn;
  const btn=document.getElementById('pb');
  btn.textContent=proxyOn?'🔗 Proxy: ON':'🔗 Proxy: OFF';
  btn.className=proxyOn?'on':'';
  document.getElementById('hint').textContent=proxyOn?'✅ Proxy active — ab CORS bypass hoga':'⚠️ Proxy OFF — ZWCorsProxy chalao phir ON karo';
  render();
}

// ========== PLAYER LOGIC ==========
const video=document.getElementById('video');
const listEl=document.getElementById('l');
const statusEl=document.getElementById('st');
const searchEl=document.getElementById('s');
const infoEl=document.getElementById('info');
let hls=null,currentIdx=-1,currentFilter='';

function setSt(msg,type){
  statusEl.textContent=msg;
  statusEl.className=type||'';
}

function render(){
  listEl.innerHTML='';
  const f=currentFilter.trim().toLowerCase();
  const filtered=CHANNELS.filter(c=>!f||c[0].toLowerCase().includes(f));
  const groups={};
  filtered.forEach(c=>{
    const g=c[0].charAt(0).toUpperCase();
    (groups[g]=groups[g]||[]).push(c);
  });
  Object.keys(groups).sort().forEach(g=>{
    const gh=document.createElement('div');
    gh.className='g';
    gh.textContent=`${g} (${groups[g].length})`;
    listEl.appendChild(gh);
    groups[g].forEach(c=>{
      const idx=CHANNELS.indexOf(c);
      const d=document.createElement('div');
      d.className='c'+(idx===currentIdx?' active':'');
      d.textContent=c[0];
      d.title=c[1];
      d.onclick=()=>play(idx);
      listEl.appendChild(d);
    });
  });
  infoEl.textContent=`${filtered.length} / ${CHANNELS.length} channels — Proxy ${proxyOn?'ON':'OFF'}`;
}

function play(idx){
  const c=CHANNELS[idx];
  if(!c)return;
  currentIdx=idx;
  const url=buildUrl(c[1]);
  setSt('⏳ Loading: '+c[0]);

  if(hls){hls.destroy();hls=null;}
  video.pause();video.removeAttribute('src');video.load();

  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.play().then(()=>setSt('▶️ '+c[0],'ok'))
      .catch(e=>setSt('❌ '+c[0]+' — '+e.message+' (dead/geo)','err'));
  } else if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30,manifestLoadingTimeOut:15000,manifestLoadingMaxRetry:2});
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play();
      setSt('▶️ '+c[0],'ok');
    });
    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(data.fatal){
        let m='❌ '+c[0]+' — ';
        if(data.details==='manifestLoadError'||data.details==='manifestLoadTimeOut')
          m+=proxyOn?'Server dead / geo-block':'CORS block — Proxy ON karo';
        else if(data.details==='manifestParsingError')m+='Invalid stream';
        else m+=data.details;
        setSt(m,'err');
        hls.destroy();hls=null;
      }
    });
  } else {
    setSt('Browser HLS support nahi karta','err');
  }

  document.querySelectorAll('#l .c').forEach(d=>d.classList.remove('active'));
  render();
}

searchEl.addEventListener('input',e=>{currentFilter=e.target.value;render()});
render();
</script>
