<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKYNET Government Helpline Numbers</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #333;
            padding: 20px 15px 50px;
        }

        /* ---------- HEADER ---------- */
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .text-blue {
            color: #1e3c72;
        }
        .text-red {
            color: #e74c3c;
        }
        header .subtitle {
            font-size: 13px;
            color: #555;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        header .subtitle::before,
        header .subtitle::after {
            content: "";
            height: 2px;
            width: 30px;
            background: #333;
        }

        /* ---------- SEARCH BAR ---------- */
        .search-container {
            max-width: 600px;
            margin: 0 auto 25px auto;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #1e3c72;
            border-radius: 30px;
            outline: none;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .search-container input:focus {
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.2);
            border-color: #e74c3c;
        }

        /* ---------- GRID ---------- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ---------- CARD ---------- */
        .card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .card .icon {
            font-size: 28px;
            margin-bottom: 8px;
            line-height: 1;
        }

        .card .title {
            font-size: 12px;
            font-weight: 700;
            color: #222;
            line-height: 1.2;
            margin-bottom: 10px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card .number-pill {
            width: 100%;
            padding: 6px 5px;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-decoration: none;
            word-break: break-all;
        }

        /* ---------- COLORS ---------- */
        .bg-red { background: #e74c3c; }
        .bg-blue { background: #1e88e5; }
        .bg-dark-blue { background: #2a5298; }
        .bg-green { background: #43a047; }
        .bg-purple { background: #8e24aa; }
        .bg-pink { background: #ec407a; }
        .bg-orange { background: #f39c12; }
        .bg-teal { background: #00acc1; }
        .bg-cyan { background: #00bcd4; }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 18px;
            display: none;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1024px) {
            .grid-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
            header .subtitle::before,
            header .subtitle::after { display: none; }
        }
        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            header h1 { font-size: 22px; }
            .card { padding: 12px 5px; }
            .card .title { font-size: 11px; height: 28px; }
            .card .number-pill { font-size: 14px; }
        }
    </style>
</head>
<body>

            { id: 53, title: "Sector 17 Police Station", number: "0172-2773951", icon: "🚓", color: "bg-orange" }
        ];

        // ---------- RENDER ----------
        function renderHelplines() {
            const grid = document.getElementById('helplineGrid');
            grid.innerHTML = '';
            helplines.forEach(item => {
                const cleanNumber = item.number.replace(/[^0-9+]/g, '');
                const isPhoneNumber = /^\d+$/.test(cleanNumber);
                const phoneLink = isPhoneNumber ? `tel:${cleanNumber}` : '#';

                const card = document.createElement('a');
                card.href = phoneLink;
                card.className = 'card';
                card.innerHTML = `
                    <div class="icon">${item.icon}</div>
                    <div class="title">${item.id}. ${item.title}</div>
                    <div class="number-pill ${item.color}">
                        ${item.number}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ---------- FILTER ----------
        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('#helplineGrid .card');
            let visibleCount = 0;

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            const emptyState = document.getElementById('emptyState');
            if (visibleCount === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        // ---------- INIT ----------
        document.addEventListener('DOMContentLoaded', () => {
            renderHelplines();
        });
    </script>
</body>
</html>
