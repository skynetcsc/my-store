<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramgarh Panchkula Business Directory</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#657089;
    --primary:#0b63ce; --primary-dark:#084b9c; --border:#dfe5ef;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    background:linear-gradient(135deg,#0b63ce,#073b75);
    color:white; padding:26px 16px 20px; text-align:center;
  }
  header h1{margin:0 0 6px; font-size:26px}
  header p{margin:0; opacity:.9; font-size:14px}
  .wrap{max-width:1100px; margin:0 auto; padding:16px}
  .searchbox{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:12px; box-shadow:0 4px 16px rgba(16,24,40,.06);
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .searchbox input{
    flex:1; min-width:220px; border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:15px; outline:none;
  }
  .searchbox input:focus{border-color:var(--primary)}
  .cat-buttons{
    display:flex; gap:8px; flex-wrap:wrap; margin:16px 0;
  }
  .cat-btn{
    border:1px solid var(--border); background:white; color:var(--text);
    padding:9px 13px; border-radius:999px; cursor:pointer; font-size:14px;
  }
  .cat-btn.active{
    background:var(--primary); color:white; border-color:var(--primary);
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:0 4px 14px rgba(16,24,40,.05);
    display:flex; flex-direction:column; gap:10px;
  }
  .card h3{margin:0; font-size:17px; line-height:1.3}
  .badge{
    display:inline-block; background:#eaf2ff; color:#084b9c;
    font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px;
    width:fit-content;
  }
  .info{font-size:14px; color:var(--muted); line-height:1.5}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
  .actions a{
    text-decoration:none; text-align:center; flex:1; min-width:90px;
    padding:10px 12px; border-radius:10px; font-weight:700; font-size:14px;
  }
  .call{background:#0b63ce; color:white}
  .wa{background:#25d366; color:#063b1b}
  .empty{
    text-align:center; padding:40px 16px; color:var(--muted);
    background:white; border:1px dashed var(--border); border-radius:16px;
  }
  .add-box{
    margin-top:26px; background:white; border:1px solid var(--border);
    border-radius:16px; padding:18px;
  }
  .add-box h2{margin:0 0 14px; font-size:20px}
  form{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  form .full{grid-column:1/-1}
  label{display:block; font-size:13px; font-weight:700; margin-bottom:6px}
  input,select{
    width:100%; border:1px solid var(--border); border-radius:10px;
    padding:11px 12px; font-size:14px; outline:none; background:white;
  }
  input:focus,select:focus{border-color:var(--primary)}
  form button{
    border:0; background:var(--primary); color:white; border-radius:10px;
    padding:12px 16px; font-weight:800; cursor:pointer; font-size:15px;
  }
  form button:hover{background:var(--primary-dark)}
  .footer{text-align:center; color:var(--muted); font-size:13px; padding:24px 16px}
  @media(max-width:640px){
    form{grid-template-columns:1fr}
    header h1{font-size:22px}
  }
</style>
</head>
<body>

<header>
  <h1>📍 Ramgarh Panchkula Business Directory</h1>
  <p>Muje Ramgarh ke aas-paas 50 km area ke business — category wise</p>
</header>

<div class="wrap">
  <div class="searchbox">
    <input id="searchInput" type="search" placeholder="Naam, mobile, address ya kaam search karein...">
  </div>

  <div id="categoryButtons" class="cat-buttons"></div>
  
  <div id="list" class="grid">
    <div class="empty" style="grid-column:1/-1">Data load ho raha hai... ⏳</div>
  </div>

  <section class="add-box">
    <h2>➕ Naya Business Add Karein</h2>
    <form id="addForm">
      <div>
        <label>Business / Person Name</label>
        <input name="Name" required placeholder="Example: Sharma Electricals">
      </div>
      <div>
        <label>Category</label>
        <select name="Category" id="formCategory" required></select>
      </div>
      <div>
        <label>Mobile Number</label>
        <input name="Phone" required placeholder="98xxxxxxxx">
      </div>
      <div>
        <label>Address / Area</label>
        <input name="Address" required placeholder="Ramgarh, Panchkula">
      </div>
      <div class="full">
        <label>Work / Service</label>
        <input name="Work" placeholder="Example: Electrician, AC repair, Kirana">
      </div>
      <div class="full">
        <label>Source (optional)</label>
        <input name="Source" placeholder="Instagram / Facebook / Reference">
      </div>
      <div class="full">
        <button type="submit" id="submitBtn">Save Business</button>
      </div>
    </form>
  </section>

  <div class="footer">
    Data Google Sheets me save hota hai. Sabhi log live dekh sakte hain.
  </div>
</div>

<script>
// आपका Google Apps Script URL यहाँ जोड़ दिया गया है
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw75U8yw81OG8RB2Nyp9pJfgxQ9kR6VCsm44-8aDp7ADZIRrwHYJXlndaVaKMx1oZh4/exec'; 

const CATEGORIES = [
  "🍽️ Food & Dining",
  "🛍️ Shopping & Retail",
  "🏥 Health & Medical",
  "🏠 Home & Services",
  "🏨 Hospitality & Tourism",
  "🏦 Banking & Finance",
  "🔧 Repair & Electrician",
  "💇 Salon & Beauty",
  "🚚 Transport & Delivery",
  "📚 Education & Tuition"
];

let businesses = [];
let activeCategory = "All";
let searchTerm = "";

// डेटा लोड करने का फंक्शन (doGet से)
async function fetchData() {
  try {
    const response = await fetch(SCRIPT_URL);
    const data = await response.json();
    // शीट से आने वाले डेटा को उल्टा करें ताकि नया बिज़नेस सबसे ऊपर दिखे
    businesses = data.reverse(); 
    renderList();
  } catch (error) {
    console.error("Error fetching data:", error);
    document.getElementById("list").innerHTML = `<div class="empty" style="grid-column:1/-1">Data load nahi ho paya. Internet ya URL check karein.</div>`;
  }
}

function esc(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function digitsOnly(phone) {
  return String(phone || "").replace(/\D/g, "");
}

function waNumber(phone) {
  const d = digitsOnly(phone);
  if (!d) return "";
  return d.length === 10 ? "91" + d : d;
}

function renderCategoryButtons() {
  const box = document.getElementById("categoryButtons");
  const all = ["All", ...CATEGORIES];
  box.innerHTML = all.map(cat => {
    const label = cat === "All" ? "📋 All" : cat;
    return `<button class="cat-btn ${activeCategory === cat ? "active" : ""}" data-cat="${esc(cat)}">${esc(label)}</button>`;
  }).join("");

  box.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      renderCategoryButtons();
      renderList();
    });
  });
}

function renderFormCategories() {
  const select = document.getElementById("formCategory");
  select.innerHTML = CATEGORIES.map(cat => `<option value="${esc(cat)}">${esc(cat)}</option>`).join("");
}

function getFiltered() {
  const q = searchTerm.trim().toLowerCase();
  return businesses.filter(b => {
    const catOk = activeCategory === "All" || b.Category === activeCategory;
    const text = [b.Name, b.Phone, b.Address, b.Work, b.Source, b.Category].join(" ").toLowerCase();
    return catOk && (!q || text.includes(q));
  });
}

function cardHTML(b) {
  const phone = digitsOnly(b.Phone);
  const wa = waNumber(b.Phone);
  const callLink = phone ? `<a class="call" href="tel:${esc(phone)}">📞 Call</a>` : "";
  const waLink = wa ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent("Namaste, main aapke business ke baare me directory se contact kar raha hoon.")}">💬 WhatsApp</a>` : "";

  return `
    <article class="card">
      <span class="badge">${esc(b.Category)}</span>
      <h3>${esc(b.Name)}</h3>
      <div class="info">
        ${b.Work ? `<div><strong>Kaam:</strong> ${esc(b.Work)}</div>` : ""}
        ${b.Address ? `<div><strong>Address:</strong> ${esc(b.Address)}</div>` : ""}
        ${b.Phone ? `<div><strong>Mobile:</strong> ${esc(b.Phone)}</div>` : `<div><strong>Mobile:</strong> Not added</div>`}
        ${b.Source ? `<div><strong>Source:</strong> ${esc(b.Source)}</div>` : ""}
      </div>
      <div class="actions">${callLink}${waLink}</div>
    </article>
  `;
}

function renderList() {
  const list = document.getElementById("list");
  const items = getFiltered();
  if (!items.length) {
    list.innerHTML = `<div class="empty" style="grid-column:1/-1">Koi business nahi mila. Search ya category badlein.</div>`;
    return;
  }
  list.innerHTML = items.map(cardHTML).join("");
}

document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderList();
});

// फॉर्म सबमिट करने का फंक्शन (doPost से)
document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  btn.innerText = "Saving...";
  btn.disabled = true;

  const formData = new FormData(e.target);
  
  try {
    // Google Apps Script में डेटा भेजें
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // CORS एरर से बचने के लिए
      body: formData
    });

    alert("Business save ho gaya ✅ (Sheet me check karein)");
    e.target.reset();
    
    // नया डेटा लोड करने के लिए 2 सेकंड बाद पेज अपडेट करें
    setTimeout(() => {
        fetchData();
    }, 2000); 
    
  } catch (error) {
    alert("Error: Data save nahi ho paya. Dobara koshish karein.");
    console.error(error);
  } finally {
    btn.innerText = "Save Business";
    btn.disabled = false;
  }
});

// शुरुआत में डेटा लोड करें
renderCategoryButtons();
renderFormCategories();
fetchData(); // सबसे पहले Google Sheet से डेटा लाएं
</script>
</body>
</html>
