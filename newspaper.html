<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Hub - ePaper PDFs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Headers */
        .header-section { margin-bottom: 30px; }
        .header-section h1 { font-size: 28px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .header-section p { font-size: 15px; color: #64748b; }
        
        /* Back Button */
        .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: #2563eb; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 20px; padding: 5px 0; transition: 0.2s; }
        .back-btn:hover { color: #1d4ed8; transform: translateX(-2px); }
        
        /* View 1: Language Grid */
        .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .lang-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none; color: inherit; }
        .lang-card:hover { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border-color: #cbd5e1; transform: translateY(-3px); }
        .lang-icon { width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; font-weight: 700; margin-bottom: 16px; }
        .lang-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #0f172a; }
        .lang-count { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .btn-green { background: #22c55e; color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; width: 100%; text-align: center; text-decoration: none; display: block; transition: 0.2s; }
        .btn-green:hover { background: #16a34a; }
        
        /* View 2: Newspaper List */
        .np-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .badge-updated { background: #eff6ff; color: #2563eb; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid #dbeafe; }
        .np-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        
        /* Direct Link Cards */
        .np-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; }
        .np-card:hover { border-color: #3b82f6; box-shadow: 0 4px 15px rgba(59,130,246,0.1); transform: translateY(-2px); }
        .np-info { display: flex; align-items: center; gap: 12px; }
        .np-logo { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 14px; flex-shrink: 0; }
        .np-name { font-size: 15px; font-weight: 600; color: #1e293b; }
        .btn-download { background: #22c55e; color: white; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; text-decoration: none; transition: 0.2s; }
        .np-card:hover .btn-download { background: #16a34a; }
        
        /* Today's Updates Section */
        .today-section { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .today-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 16px; }
        .today-title { font-size: 20px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .today-date { background: #fef2f2; color: #dc2626; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; }
        .update-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .update-card { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; text-decoration: none; color: #1e293b; transition: 0.2s; }
        .update-card:hover { background: #f8fafc; border-color: #cbd5e1; }
        .update-info { display: flex; align-items: center; gap: 12px; }
        .update-logo { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 12px; }
        .update-name { font-size: 14px; font-weight: 600; }
        .btn-small { background: #eff6ff; color: #2563eb; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .btn-small:hover { background: #dbeafe; }
        
        @media (max-width: 600px) {
            .np-grid { grid-template-columns: 1fr; }
            .lang-grid { grid-template-columns: repeat(2, 1fr); }
            .lang-card { padding: 16px 10px; }
            .lang-icon { width: 48px; height: 48px; font-size: 24px; }
            .np-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .btn-download { width: 100%; justify-content: center; }
            .today-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .update-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        let currentState = {
            view: 'home',
            language: null
        };

        function render() {
            const app = document.getElementById('app');
            if (currentState.view === 'home') {
                app.innerHTML = renderHome();
            } else if (currentState.view === 'newspapers') {
                app.innerHTML = renderNewspapers();
            }
        }

        // --- View 0: Home Page ---
        function renderHome() {
            const today = new Date();
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            const dateStr = today.toLocaleDateString('en-GB', options);

            const topUpdates = [
                { lang: 'English', index: 0 }, { lang: 'English', index: 1 },
                { lang: 'Hindi', index: 0 }, { lang: 'Hindi', index: 1 },
                { lang: 'Punjabi', index: 0 }, { lang: 'Bengali', index: 0 }
            ];

            let updatesHtml = '';
            topUpdates.forEach(item => {
                const np = newspaperData[item.lang].papers[item.index];
                if (np) {
                    updatesHtml += `
                        <a href="${np.epaper}" target="_blank" class="update-card">
                            <div class="update-info">
                                <div class="update-logo" style="background-color: ${np.color};">${np.short}</div>
                                <div class="update-name">${np.name}</div>
                            </div>
                            <div class="btn-small">Download</div>
                        </a>
                    `;
                }
            });

            let langHtml = `
                <div class="container">
                    <div class="header-section" style="margin-top: 40px;">
                        <h1>Browse by Language</h1>
                        <p>Choose your preferred language to explore newspapers</p>
                    </div>
                    <div class="lang-grid">
            `;
            
            for (const [lang, data] of Object.entries(newspaperData)) {
                const count = data.papers.length;
                langHtml += `
                    <div class="lang-card" onclick="selectLanguage('${lang}')">
                        <div class="lang-icon" style="background-color: ${data.color};">${data.icon}</div>
                        <div class="lang-name">${lang} Epaper</div>
                        <div class="lang-count">${count} Newspapers</div>
                        <button class="btn-green">Download Now</button>
                    </div>
                `;
            }
            
            langHtml += `</div></div>`;

            return `
                <div class="container">
                    <div class="today-section">
                        <div class="today-header">
                            <div class="today-title">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                Today's E-Paper Updates
                            </div>
                            <div class="today-date">${dateStr}</div>
                        </div>
                        <div class="update-grid">
                            ${updatesHtml}
                        </div>
                    </div>
                </div>
                ${langHtml}
            `;
        }

        // --- View 2: Newspapers List ---
        function renderNewspapers() {
            const lang = currentState.language;
            const data = newspaperData[lang];
            
            let html = `
                <div class="container">
                    <button class="back-btn" onclick="goBack()">← Back to Languages</button>
                    <div class="np-header">
                        <div class="header-section" style="margin-bottom:0;">
                            <h1>${lang} ePaper in PDF</h1>
                            <p>Click on your favourite newspaper to read the latest ePaper</p>
                        </div>
                        <div class="badge-updated">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                            Daily Updated
                        </div>
                    </div>
                    <div class="np-grid">
            `;
            
            data.papers.forEach((np) => {
                // सीधे ओरिजिनल साइट पर जाने के लिए <a> टैग का उपयोग
                html += `
                    <a href="${np.epaper}" target="_blank" class="np-card">
                        <div class="np-info">
                            <div class="np-logo" style="background-color: ${np.color};">${np.short}</div>
                            <div class="np-name">${np.name}</div>
                        </div>
                        <div class="btn-download">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                            Download PDF
                        </div>
                    </a>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        // Navigation functions
        function selectLanguage(lang) {
            currentState.language = lang;
            currentState.view = 'newspapers';
            render();
            window.scrollTo(0, 0);
        }

        function goBack() {
            if (currentState.view === 'newspapers') {
                currentState.view = 'home';
                currentState.language = null;
            }
            render();
            window.scrollTo(0, 0);
        }

        // Initial render
        render();
    </script>
</body>
</html>
